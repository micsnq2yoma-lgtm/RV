<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RV · Panda 工作台</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#e5eaf3;background:#0c1220;font-size:14px}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:19px 28px;border-bottom:1px solid #27334a;background:#111a2b}h1{font-size:20px;letter-spacing:.7px;margin:0}h1 span{color:#6ee7c4}small,.muted{color:#8fa1ba}main{max-width:1640px;margin:auto;padding:20px 28px}.taskbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}input,select,button{font:inherit;border:1px solid #35445e;background:#18243a;color:inherit;border-radius:7px;padding:10px 12px}input#task{flex:1;min-width:160px}#seed{width:92px}button{cursor:pointer}button.primary{background:#6ee7c4;color:#071c19;border-color:#6ee7c4;font-weight:700}button.danger{color:#ffb4ad}button:disabled{opacity:.45;cursor:default}.layout{display:grid;grid-template-columns:minmax(560px,1.6fr) minmax(330px,1fr);gap:18px}.panel{background:#111c2e;border:1px solid #28354b;border-radius:10px;overflow:hidden}.panel-head{padding:13px 16px;border-bottom:1px solid #28354b;display:flex;justify-content:space-between;align-items:center;font-weight:600}.views{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#26344b}.view{position:relative;background:#080d16;min-height:190px;aspect-ratio:4/3}.view img{width:100%;height:100%;object-fit:contain}.view label{position:absolute;top:10px;left:12px;background:#101c30d9;border:1px solid #3b4960;padding:4px 8px;border-radius:4px;font-size:12px}.timeline{height:440px;overflow:auto;padding:14px}.event{border-left:2px solid #527e91;margin:0 0 16px 6px;padding:0 0 0 15px}.event b{color:#6ee7c4}.event p{line-height:1.55;margin:8px 0}.event pre{font:12px/1.5 Consolas,monospace;white-space:pre-wrap;color:#b1c4da}.empty{padding:50px 20px;text-align:center;color:#8fa1ba;line-height:1.8}.resources{margin-top:18px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px}.metricbody{padding:15px 16px;line-height:1.9}.big{font-size:25px;font-weight:650;color:#e9f2ff}canvas{display:block;width:100%;height:85px;margin-top:6px}.row{display:flex;justify-content:space-between;gap:12px}#notice{min-height:24px;color:#9cb9cd;margin-bottom:8px}#connection{font-size:13px}.pill{border:1px solid #3d526e;padding:5px 9px;border-radius:20px;font-size:12px}.good{color:#6ee7c4}.bad{color:#ffb4ad}footer{display:flex;justify-content:space-between;color:#788ca7;padding:15px 0;font-size:12px}.replay{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #28354b}.replay select{flex:1;min-width:0;padding:7px}#cpuLabel{font-size:12px}.tiny{font-size:12px}#proc{font-size:11px;white-space:pre-wrap}@media(max-width:1000px){.layout{grid-template-columns:1fr}.resources{grid-template-columns:1fr}.taskbar{flex-wrap:wrap}.timeline{height:330px}main{padding:14px}}
[hidden]{display:none!important}@media(min-width:761px) and (max-width:1000px){.layout{grid-template-columns:minmax(380px,1.4fr) minmax(270px,1fr)}.resources{grid-template-columns:1.2fr 1fr 1fr}.timeline{height:330px}.view{min-height:0}main{padding:14px}.metricbody{padding:12px;font-size:12px}}
</style>
<header><div><h1><span>RV</span> / Panda 工作台</h1><small>板上感知与规划 · MuJoCo 仿真</small></div><div id="connection">正在连接开发板…</div></header>
<main>
<div class="taskbar"><input id="task" value="把红色方块放进左边的托盘" aria-label="中文任务"><input id="seed" type="number" min="0" value="1400" aria-label="场景 seed"><button id="start" class="primary">开始任务</button><button id="stop" class="danger">停止并回位</button></div>
<div id="notice">输入一句任务，查看智能体如何观察、决策和执行。</div>
<div class="layout"><section class="panel"><div class="panel-head"><span id="viewTitle">实时视角</span><span><select id="fps" aria-label="刷新帧率"><option value="4">4 帧 / 秒</option><option value="2">2 帧 / 秒</option><option value="1">1 帧 / 秒</option></select> <span class="pill" id="rate">等待画面</span></span></div><div class="views">
<div class="view"><img id="top" alt="俯视相机画面"><label>TOP · 俯视</label></div><div class="view"><img id="front" alt="正面相机画面"><label>FRONT · 正面</label></div><div class="view"><img id="side" alt="侧面相机画面"><label>SIDE · 侧面</label></div><div class="view"><img id="wrist" alt="腕部相机画面"><label>WRIST · 腕部</label></div></div></section>
<section class="panel"><div class="panel-head"><span>智能体时间线</span><span id="step" class="pill">待命</span></div><div id="timeline" class="timeline"><div class="empty">还没有任务记录<br>场景、行动说明与工具结果将在这里显示</div></div><div class="replay"><select id="runs" aria-label="任务回放"><option value="">选择已完成任务回放</option></select><button id="live">回到实时</button></div><div class="replay" id="replayControls" hidden><button id="prev">上一步</button><span id="replayStep"></span><button id="next">下一步</button></div></section></div>
<div class="resources"><section class="panel"><div class="panel-head"><span>CPU · 最近 60 秒</span><span id="cpuLabel">CPU0 — / CPU1 —</span></div><div class="metricbody"><canvas id="chart" width="520" height="110"></canvas><div id="proc">等待进程采样</div></div></section>
<section class="panel"><div class="panel-head"><span>实时控制</span><small>CPU1 · FIFO80</small></div><div class="metricbody"><div><span id="rtmax" class="big">—</span> <small>ms / 处理峰值</small></div><div class="row"><span>处理均值 / 到包峰值</span><span id="rtmean">—</span></div><div class="row"><span>当前统计周期丢包</span><span id="loss">—</span></div><div class="row"><span>累计 token / 用时</span><span id="usage">—</span></div></div></section>
<section class="panel"><div class="panel-head"><span>内存 · 网络 · 中断</span><small id="temperature">温度不可用</small></div><div class="metricbody"><div id="mem">等待采样</div><div id="tmp"></div><div id="net"></div><div id="irq" class="tiny"></div></div></section></div>
<footer><span>仅仿真 · 停止请求会等待当前技能结束，再回到 home</span><span id="runLabel">RV / UX900 · 2 cores</span></footer></main>
<script>
const $=id=>document.getElementById(id);let current=null,replaying=false,replayRows=[],replayIndex=0,lastStep='',history=[],lastFrame=0,lastFrameTime=performance.now();
async function api(path,body){let r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let x=await r.json();if(!r.ok)throw Error(x.detail||x.error||r.status);return x}
function notice(s){$('notice').textContent=s}function num(n,d=1){return typeof n==='number'?n.toFixed(d):'—'}
$('start').onclick=async()=>{try{let r=await api('/task',{task:$('task').value,seed:$('seed').value===''?null:Number($('seed').value)});current=r.run;replaying=false;lastStep='';notice('任务已启动');}catch(e){notice(e.message)}};
$('stop').onclick=async()=>{try{await api('/stop',{});notice('已请求停止，等待当前技能完成后回位…')}catch(e){notice(e.message)}};
$('fps').onchange=()=>api('/refresh',{fps:Number($('fps').value),enabled:true}).catch(e=>notice(e.message));
function timeline(rows){let box=$('timeline');box.replaceChildren();if(!rows.length){let e=document.createElement('div');e.className='empty';e.textContent='正在观察场景与规划下一步…';box.append(e)}for(let r of rows){let el=document.createElement('div');el.className='event';let title=document.createElement('b');title.textContent=`${String(r.step).padStart(2,'0')} · ${r.tool} ${JSON.stringify(r.arguments)}`;el.append(title);let p=document.createElement('p');p.textContent=r.response?.content||'已选择下一项操作';el.append(p);let scene=document.createElement('small');scene.textContent=r.scene.objects.filter(o=>o.name.endsWith('cube')).map(o=>o.name+': '+o.in+(o.occluded?'（遮挡）':'')).join(' · ');el.append(scene);let pre=document.createElement('pre');pre.textContent=JSON.stringify(r.result)+'\n'+num(r.seconds)+' s · '+(r.usage?.total_tokens||0)+' tokens';el.append(pre);box.append(el)}box.scrollTop=box.scrollHeight}
function chart(){let c=$('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#2a3950';for(let y of [10,55,100]){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}for(let j=0;j<2;j++){ctx.strokeStyle=j?'#8da8ff':'#6ee7c4';ctx.lineWidth=2;ctx.beginPath();history.forEach((v,i)=>{let x=i*c.width/59,y=100-Math.min(100,v[j])*.9;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}}
async function poll(){try{let s=await api('/state');$('connection').textContent=s.error?'连接异常 · '+s.error:s.connected?'● 开发板与仿真已连接':'等待仿真连接';$('connection').className=s.connected&&!s.error?'good':'bad';let r=s.resources||{},cpu=r.cpus||{},rt=r.rt||{},st=s.status||{};let c0=cpu.cpu0?.busy||0,c1=cpu.cpu1?.busy||0;history.push([c0,c1]);if(history.length>60)history.shift();chart();$('cpuLabel').textContent=`CPU0 ${num(c0,0)}% / CPU1 ${num(c1,0)}%`;$('proc').textContent=Object.entries(r.processes||{}).map(([k,v])=>`${k}: ${num(v.percent)}% · CPU${v.cpu} · ${v.policy===1?'FIFO'+v.priority:'OTHER'}`).join('\n');$('rtmax').textContent=num(rt.lifetime_processing_us_max/1000,3);$('rtmax').className='big '+(rt.lifetime_processing_us_max>=1000?'bad':'good');$('rtmean').textContent=`${num(rt.processing_us_mean/1000,3)} / ${num(rt.lifetime_interval_ms_max,2)} ms`;$('loss').textContent=rt.lost??'—';$('usage').textContent=`${st.tokens||0} / ${num(st.seconds)} s`;$('mem').textContent=`内存可用 ${num(r.memory?.available_mb,0)} / ${num(r.memory?.total_mb,0)} MB`;$('tmp').textContent=`RAM 文件 ${num(r.memory?.tmp_used_mb,1)} MB`;$('net').textContent=`eth0 ↓ ${num(r.eth0_bytes_per_s?.rx/1024)} ↑ ${num(r.eth0_bytes_per_s?.tx/1024)} KB/s`;$('irq').textContent=Object.entries(r.irq_per_s||{}).map(([k,v])=>`${k} ${num(v,0)}/s`).join(' · ');if(r.temperatures_c?.length)$('temperature').textContent=r.temperatures_c.map(v=>num(v)+'°C').join(' / ');$('step').textContent=st.status==='running'?`步骤 ${st.step||0} · ${st.action||'运行中'}`:(st.status||'待命');$('start').disabled=st.status==='running';$('stop').disabled=st.status!=='running';if(s.run){current=s.run;$('runLabel').textContent=s.run}if(!replaying&&current){let signature=current+':'+st.step+':'+st.status;if(signature!==lastStep){lastStep=signature;let d=await api('/runs/'+current);timeline(d.steps)}}if(s.evaluation?.evaluated&&!replaying)notice('真值验收：'+(s.evaluation.success?'成功':'未达目标')+' · 智能体状态 '+st.status);else if(st.status==='running'&&!replaying)notice(st.action||'运行中');}catch(e){$('connection').textContent='连接中断';$('connection').className='bad'}setTimeout(poll,1000)}
function connectVideo(){let ws=new WebSocket('ws://'+location.host+'/video');ws.onmessage=e=>{let f=JSON.parse(e.data);if(replaying)return;for(let [k,v] of Object.entries(f.images))$(k).src='data:image/jpeg;base64,'+v.jpeg_b64;let now=performance.now();if(now-lastFrameTime>2000){$('rate').textContent=num((f.seq-lastFrame)*1000/(now-lastFrameTime))+' 帧/s';lastFrame=f.seq;lastFrameTime=now}};ws.onclose=()=>setTimeout(connectVideo,2000)}
async function listRuns(){try{let rows=await api('/runs'),sel=$('runs'),value=sel.value;sel.replaceChildren(new Option('选择已完成任务回放',''));for(let r of rows)if(r.status!=='running')sel.add(new Option(r.run+' · '+r.task,r.run));sel.value=value}catch{}setTimeout(listRuns,5000)}
function replay(){let row=replayRows[replayIndex];if(!row)return;for(let [k,file] of Object.entries(row.images))$(k).src=`/runs/${$('runs').value}/file/${file}`;$('replayStep').textContent=`${replayIndex+1} / ${replayRows.length}`;timeline([row])}
$('runs').onchange=async()=>{if(!$('runs').value)return;try{let d=await api('/runs/'+$('runs').value);replayRows=d.steps;replayIndex=0;replaying=true;$('viewTitle').textContent='任务回放';$('replayControls').hidden=false;replay()}catch(e){notice(e.message)}};
$('prev').onclick=()=>{replayIndex=Math.max(0,replayIndex-1);replay()};$('next').onclick=()=>{replayIndex=Math.min(replayRows.length-1,replayIndex+1);replay()};$('live').onclick=()=>{replaying=false;lastStep='';$('viewTitle').textContent='实时视角';$('replayControls').hidden=true;$('runs').value=''};
poll();connectVideo();listRuns();
</script></html>
